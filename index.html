<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="style.css">

	<title>Cards Game By SLaplace</title>
</head>
<body>
	<div class="content">
		<form onsubmit="return false" class="gheader">
			
			<label for="size">Number of card couples</label>
			<input placeholder="6" type="number" name="size" id="size" min="1" pattern="\d*">

			<label for="size">Min Value</label>
			<input placeholder="0" type="number" name="minnum" id="minnum" min="1" pattern="\d*">

			<label for="size">Max Value</label>
			<input placeholder="100" type="number" name="maxnum" id="maxnum" min="2" pattern="\d*">

			<button onclick="start(false)">Start</button>
		</form>
		
		<div class="game">
			
		</div>
	</div>
<script type="text/javascript" src="script.js"></script>
</body>
</html>
